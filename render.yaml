services:
  - type: web
    name: roommatematch-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: ./backend
    plan: standard
    branch: main
    region: frankfurt
    numInstances: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: '--max-old-space-size=2048'
      - key: DB_SYNC
        value: 'false'
      - key: DB_POOL_MIN
        value: '5'
      - key: DB_POOL_MAX
        value: '20'
      - key: DB_HOST
        fromDatabase:
          name: roommatematch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: roommatematch-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: roommatematch-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: roommatematch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: roommatematch-db
          property: password
      - key: BACKEND_BASE_URL
        value: https://roommatematch-api.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DESTINATION_BANK_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: RoomMate Match <facturas@roommatematchapp.com>
      - key: REDIS_URL
        fromService:
          type: redis
          name: roommatematch-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: roommatematch-db
    plan: starter
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

redis:
  - name: roommatematch-redis
    plan: starter
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
