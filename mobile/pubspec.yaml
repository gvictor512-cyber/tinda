name: roommatematch
description: RoomMate Match - Find your perfect roommate
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management
  provider: ^6.0.5
  
  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.6.0
  
  # Authentication
  google_sign_in: 6.3.0
  sign_in_with_apple: ^8.2.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  swipable_stack: ^2.0.0
  image_picker: ^1.0.4
  smooth_page_indicator: ^3.0.0
  
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.3.3
  socket_io_client: ^3.1.6
  
  # Local Storage
  shared_preferences: ^2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.1
  in_app_review: ^2.0.10
  permission_handler: ^13.0.1
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
  geolocator: ^14.0.3
  geocoding: 4.0.0
  flutter_secure_storage: ^11.0.0
  camera: ^0.12.0+2
  
  # Payments
  flutter_stripe: ^14.0.0
  in_app_purchase: ^3.2.0
  
  # Email
  # flutter_email_sender: ^6.0.1  # Removed due to compatibility issues
  # mailer: ^6.0.0  # Removed due to compatibility issues

  flutter_markdown: ^0.7.7+1

  http: ^1.2.0
  app_links: ^7.2.1
  package_info_plus: ^10.2.1
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/legal/
    - assets/images/
  
  # fonts:
  #   - family: SF Pro Display
  #     fonts:
  #       - asset: assets/fonts/SFProDisplay-Regular.ttf
  #       - asset: assets/fonts/SFProDisplay-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/SFProDisplay-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  image_path: "assets/images/logo_launcher.png"
  image_path_ios: "assets/images/logo_launcher_ios.png"
  android: true
  ios: true
