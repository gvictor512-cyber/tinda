name: roommatematch
description: RoomMate Match - Find your perfect roommate
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  
  # Authentication
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  swipable_stack: ^2.0.0
  image_picker: ^1.0.4
  smooth_page_indicator: ^1.1.0
  
  # Networking
  dio: ^5.3.3
  socket_io_client: ^2.0.3+1
  
  # Local Storage
  shared_preferences: ^2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1
  permission_handler: ^11.0.1
  flutter_local_notifications: ^17.2.4
  geolocator: ^10.1.0
  geocoding: ^4.0.0
  flutter_secure_storage: ^9.0.0
  
  # Payments
  flutter_stripe: ^11.0.0
  
  # Email
  # flutter_email_sender: ^6.0.1  # Removed due to compatibility issues
  # mailer: ^6.0.0  # Removed due to compatibility issues

  flutter_markdown: ^0.6.23

  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/legal/
  
