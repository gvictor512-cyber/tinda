<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña - RoomMate Match</title>
  <style>
    :root {
      --primary: #4A90E2;
      --error: #E25C5C;
      --success: #5CB85C;
      --text: #333333;
      --bg: #F5F7FA;
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: var(--primary);
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
    }
    h1 { text-align: center; margin: 0 0 8px; font-size: 24px; }
    p { text-align: center; color: #666; margin: 0 0 24px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 6px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .hint { font-size: 12px; color: #888; margin-bottom: 16px; }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #9CA3AF; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; }
    .message.error { background: #FEF2F2; color: var(--error); }
    .message.success { background: #ECFDF5; color: #047857; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠</div>
    <h1 id="title">Restablecer contraseña</h1>
    <p id="subtitle">Crea una nueva contraseña para tu cuenta.</p>

    <form id="resetForm">
      <label for="password" id="passwordLabel">Nueva contraseña</label>
      <input type="password" id="password" minlength="6" required>
      <div class="hint" id="passwordHint">Mínimo 6 caracteres.</div>

      <label for="confirmPassword" id="confirmLabel">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" minlength="6" required>

      <button type="submit" id="submitBtn">Guardar nueva contraseña</button>
    </form>

    <div id="message" class="message" style="display: none;"></div>
    <div class="footer" id="footer">© 2026 RoomMate Match</div>
  </div>

  <script>
    // ===== CONFIGURATION =====
    // Replace this with your Firebase Web API key from Firebase Console > Project settings
    const FIREBASE_API_KEY = 'YOUR_FIREBASE_WEB_API_KEY';

    // ===== LOCALIZATION =====
    const translations = {
      es: {
        title: 'Restablecer contraseña',
        subtitle: 'Crea una nueva contraseña para tu cuenta.',
        passwordLabel: 'Nueva contraseña',
        passwordHint: 'Mínimo 6 caracteres.',
        confirmLabel: 'Confirmar contraseña',
        submit: 'Guardar nueva contraseña',
        saving: 'Guardando...',
        success: 'Contraseña actualizada correctamente. Ya puedes iniciar sesión en la app.',
        passwordsDoNotMatch: 'Las contraseñas no coinciden.',
        tooShort: 'La contraseña debe tener al menos 6 caracteres.',
        invalidLink: 'El enlace no es válido o ha expirado. Solicita uno nuevo.',
        genericError: 'No se pudo restablecer la contraseña. Inténtalo de nuevo.',
        footer: '© 2026 RoomMate Match'
      },
      en: {
        title: 'Reset password',
        subtitle: 'Create a new password for your account.',
        passwordLabel: 'New password',
        passwordHint: 'At least 6 characters.',
        confirmLabel: 'Confirm password',
        submit: 'Save new password',
        saving: 'Saving...',
        success: 'Password updated successfully. You can now sign in to the app.',
        passwordsDoNotMatch: 'Passwords do not match.',
        tooShort: 'Password must be at least 6 characters.',
        invalidLink: 'The link is invalid or has expired. Please request a new one.',
        genericError: 'Could not reset the password. Please try again.',
        footer: '© 2026 RoomMate Match'
      },
      fr: {
        title: 'Réinitialiser le mot de passe',
        subtitle: 'Créez un nouveau mot de passe pour votre compte.',
        passwordLabel: 'Nouveau mot de passe',
        passwordHint: 'Au moins 6 caractères.',
        confirmLabel: 'Confirmer le mot de passe',
        submit: 'Enregistrer le mot de passe',
        saving: 'Enregistrement...',
        success: 'Mot de passe mis à jour. Vous pouvez maintenant vous connecter.',
        passwordsDoNotMatch: 'Les mots de passe ne correspondent pas.',
        tooShort: 'Le mot de passe doit comporter au moins 6 caractères.',
        invalidLink: 'Le lien est invalide ou a expiré. Veuillez en demander un nouveau.',
        genericError: 'Impossible de réinitialiser le mot de passe. Veuillez réessayer.',
        footer: '© 2026 RoomMate Match'
      },
      de: {
        title: 'Passwort zurücksetzen',
        subtitle: 'Erstellen Sie ein neues Passwort für Ihr Konto.',
        passwordLabel: 'Neues Passwort',
        passwordHint: 'Mindestens 6 Zeichen.',
        confirmLabel: 'Passwort bestätigen',
        submit: 'Neues Passwort speichern',
        saving: 'Speichern...',
        success: 'Passwort erfolgreich aktualisiert. Sie können sich jetzt in der App anmelden.',
        passwordsDoNotMatch: 'Passwörter stimmen nicht überein.',
        tooShort: 'Passwort muss mindestens 6 Zeichen lang sein.',
        invalidLink: 'Der Link ist ungültig oder abgelaufen. Bitte fordern Sie einen neuen an.',
        genericError: 'Passwort konnte nicht zurückgesetzt werden. Bitte versuchen Sie es erneut.',
        footer: '© 2026 RoomMate Match'
      },
      pt: {
        title: 'Redefinir senha',
        subtitle: 'Crie uma nova senha para sua conta.',
        passwordLabel: 'Nova senha',
        passwordHint: 'Pelo menos 6 caracteres.',
        confirmLabel: 'Confirmar senha',
        submit: 'Salvar nova senha',
        saving: 'Salvando...',
        success: 'Senha atualizada com sucesso. Agora você pode fazer login no app.',
        passwordsDoNotMatch: 'As senhas não coincidem.',
        tooShort: 'A senha deve ter pelo menos 6 caracteres.',
        invalidLink: 'O link é inválido ou expirou. Solicite um novo.',
        genericError: 'Não foi possível redefinir a senha. Tente novamente.',
        footer: '© 2026 RoomMate Match'
      },
      it: {
        title: 'Reimposta password',
        subtitle: 'Crea una nuova password per il tuo account.',
        passwordLabel: 'Nuova password',
        passwordHint: 'Almeno 6 caratteri.',
        confirmLabel: 'Conferma password',
        submit: 'Salva nuova password',
        saving: 'Salvataggio...',
        success: 'Password aggiornata con successo. Ora puoi accedere all\'app.',
        passwordsDoNotMatch: 'Le password non coincidono.',
        tooShort: 'La password deve contenere almeno 6 caratteri.',
        invalidLink: 'Il link non è valido o è scaduto. Richiedine uno nuovo.',
        genericError: 'Impossibile reimpostare la password. Riprova.',
        footer: '© 2026 RoomMate Match'
      }
    };

    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || navigator.language.split('-')[0] || 'es';
    const country = params.get('country') || (navigator.language.split('-')[1] || '');
    const oobCode = params.get('oobCode') || params.get('mode') === 'resetPassword' ? params.get('oobCode') : null;

    const t = translations[lang] || translations['es'];

    document.documentElement.lang = lang + (country ? '-' + country : '');
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('passwordLabel').textContent = t.passwordLabel;
    document.getElementById('passwordHint').textContent = t.passwordHint;
    document.getElementById('confirmLabel').textContent = t.confirmLabel;
    document.getElementById('submitBtn').textContent = t.submit;
    document.getElementById('footer').textContent = t.footer;

    if (FIREBASE_API_KEY === 'YOUR_FIREBASE_WEB_API_KEY') {
      showMessage('Falta configurar FIREBASE_API_KEY en esta página. Contacta con soporte.', true);
    }

    function showMessage(text, isError) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + (isError ? 'error' : 'success');
      msg.style.display = 'block';
    }

    const form = document.getElementById('resetForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      if (password.length < 6) {
        showMessage(t.tooShort, true);
        return;
      }
      if (password !== confirm) {
        showMessage(t.passwordsDoNotMatch, true);
        return;
      }
      if (!oobCode) {
        showMessage(t.invalidLink, true);
        return;
      }
      if (FIREBASE_API_KEY === 'YOUR_FIREBASE_WEB_API_KEY') {
        showMessage('Falta configurar FIREBASE_API_KEY en esta página.', true);
        return;
      }

      btn.disabled = true;
      const originalText = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>' + t.saving;

      try {
        const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=${FIREBASE_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oobCode: oobCode, newPassword: password })
        });

        if (response.ok) {
          showMessage(t.success, false);
          form.style.display = 'none';
        } else {
          const data = await response.json();
          showMessage(data.error?.message ? mapFirebaseError(data.error.message, t) : t.genericError, true);
          btn.disabled = false;
          btn.textContent = originalText;
        }
      } catch (err) {
        showMessage(t.genericError, true);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    function mapFirebaseError(code, t) {
      if (code.includes('INVALID_OOB_CODE') || code.includes('EXPIRED_OOB_CODE')) return t.invalidLink;
      if (code.includes('WEAK_PASSWORD')) return t.tooShort;
      return t.genericError;
    }
  </script>
</body>
</html>
