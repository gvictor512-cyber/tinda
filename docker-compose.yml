version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: roommatematch_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roommatematch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roommatematch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
