workflows:
  # Build iOS for the simulator. No Apple Developer account needed,
  # but the .app must run on a macOS simulator (not on Windows).
  flutter-ios-simulator:
    name: Flutter iOS - Simulator
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cache:
        cache_paths:
          - $CM_BUILD_DIR/.pub-cache
          - $HOME/.cocoapods
    working_directory: mobile
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS for simulator
        script: flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/Runner.app

  # Build a signed .ipa and upload it to TestFlight.
  # Requires an Apple Developer account and the Codemagic credential group.
  flutter-ios-testflight:
    name: Flutter iOS - TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.roommatematch.app
      groups:
        - apple_credentials
      cache:
        cache_paths:
          - $CM_BUILD_DIR/.pub-cache
          - $HOME/.cocoapods
    working_directory: mobile
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build release .ipa
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # Build a signed Android App Bundle (AAB) for Google Play.
  # Configure el keystore en Codemagic (Variables) y rellena los valores.
  flutter-android-playstore:
    name: Flutter Android - Play Store AAB
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - android_credentials
      cache:
        cache_paths:
          - $CM_BUILD_DIR/.pub-cache
    working_directory: mobile
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
