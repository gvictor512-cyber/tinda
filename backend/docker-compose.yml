version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: roommatematch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: roommatematch
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/setup_roles.sh:/docker-entrypoint-initdb.d/01-setup-roles.sh:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ../database/rls.sql:/docker-entrypoint-initdb.d/03-rls.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roommatematch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roommatematch-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: app_user
      DB_DATABASE: roommatematch
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
